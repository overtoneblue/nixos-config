<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>wavegen-web</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #111;
    --bg2: #1a1a1a;
    --surface: #222;
    --surface2: #2a2a2a;
    --border: #333;
    --text: #e0e0e0;
    --text2: #999;
    --accent: #4a9eff;
    --accent-hover: #3a8eef;
    --danger: #ff4444;
    --success: #44cc66;
    --warning: #ffaa33;
    --radius: 12px;
    --radius-sm: 8px;
  }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }

  /* Login screen */
  #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  #login-screen h1 { font-size: 1.6rem; margin-bottom: 8px; }
  #login-screen p { color: var(--text2); margin-bottom: 24px; }
  #login-form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
  #login-form input { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1rem; }
  #login-form button { width: 100%; padding: 14px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  #login-form button:active { background: var(--accent-hover); }
  #login-error { color: var(--danger); font-size: 0.9rem; margin-top: 8px; display: none; }

  /* History toolbar + delete */
  .history-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .clear-btn { background: none; border: 1px solid var(--border); color: var(--text2); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }
  .clear-btn:active { color: var(--danger); border-color: var(--danger); }
  .delete-btn { background: none; border: 1px solid var(--border); color: var(--text2); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 0.85rem; cursor: pointer; margin-left: auto; }
  .delete-btn:active { color: var(--danger); border-color: var(--danger); }
  .edit-btn { background: none; border: 1px solid var(--border); color: var(--text2); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 0.85rem; cursor: pointer; }
  .edit-btn:active { color: var(--accent); border-color: var(--accent); }
  .edit-banner { display: none; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 0.85rem; color: var(--text2); margin-bottom: 12px; }
  .edit-banner.visible { display: flex; }
  .edit-banner button { margin-left: auto; background: none; border: none; color: var(--text2); font-size: 1.1rem; cursor: pointer; padding: 0 4px; }

  /* Workstation slots */
  .slot { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 14px; transition: border-color .2s, box-shadow .2s; }
  .slot-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .slot-title { font-weight: 600; font-size: 0.95rem; }
  .slot-lineage { color: var(--text2); font-size: 0.75rem; }
  .slot-copy { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--text2); border-radius: 6px; height: 28px; padding: 0 10px; font-size: 0.8rem; cursor: pointer; }
  .slot-copy:active { color: var(--accent); border-color: var(--accent); }
  .slot.drop-hint, .slot.flash { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .slot-save { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .slot-fname { flex: 1; min-width: 130px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 0.85rem; }
  .slot-folder { background: none; border: 1px solid var(--border); color: var(--text2); border-radius: 6px; height: 34px; padding: 0 10px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
  .slot-folder:active { color: var(--accent); border-color: var(--accent); }
  .slot-save-status { font-size: 0.75rem; color: var(--accent); }
  .slot-remove { margin-left: 4px; background: none; border: 1px solid var(--border); color: var(--text2); border-radius: 6px; width: 28px; height: 28px; font-size: 1rem; line-height: 1; cursor: pointer; }
  .slot-thumbs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 8px; }
  .slot-thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid #333; display: block; }
  .slot-thumbwrap { position: relative; flex-shrink: 0; }
  .slot-thumbwrap button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: none; background: #ff4444; color: #fff; font-size: 12px; cursor: pointer; }
  .slot-add { display: flex; align-items: center; justify-content: center; border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 10px; color: var(--text2); font-size: 0.85rem; cursor: pointer; margin-bottom: 8px; }
  .slot-prompt { width: 100%; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg2); color: var(--text); font-size: 0.95rem; resize: vertical; margin-bottom: 8px; }
  .slot-statusrow { display: none; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text2); margin-bottom: 8px; }
  .slot-statusrow.visible { display: flex; }
  .slot-gen { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: none; background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  .slot-gen:disabled { opacity: 0.5; cursor: default; }
  .slot-result { margin-top: 10px; }
  .slot-result img { width: 100%; border-radius: var(--radius-sm); display: block; }
  .slot-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .slot-actions button { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: none; color: var(--text); font-size: 0.85rem; cursor: pointer; }
  .slot-actions a { flex: 1; display: flex; text-decoration: none; }
  .slot-actions a button { width: 100%; }
  .add-slot-btn { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px dashed var(--border); background: none; color: var(--text2); font-size: 0.9rem; cursor: pointer; margin-top: 4px; }
  .add-slot-btn:disabled { opacity: 0.5; }

  /* App layout */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  .app-header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px; }
  .app-header h1 { font-size: 1.2rem; font-weight: 600; }

  /* Tabs */
  .tab-bar { display: flex; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .tab-btn { flex: 1; padding: 14px 16px; text-align: center; font-size: 0.95rem; font-weight: 500; color: var(--text2); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; flex: 1; padding: 16px; }
  .tab-content.active { display: block; }

  /* New tab */
  .upload-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px 16px; text-align: center; color: var(--text2); cursor: pointer; transition: border-color 0.2s; background: var(--surface); }
  .upload-zone:active, .upload-zone.dragover { border-color: var(--accent); background: var(--surface2); }
  .upload-zone input { display: none; }
  .upload-zone .icon { font-size: 2rem; margin-bottom: 8px; }

  /* Thumbnail strip */
  .thumb-strip { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; }
  .thumb-strip img { width: 72px; height: 72px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); flex-shrink: 0; }

  /* Input area */
  #prompt-area { width: 100%; min-height: 80px; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1rem; resize: vertical; margin: 12px 0; font-family: inherit; }
  #prompt-area:focus { outline: none; border-color: var(--accent); }

  .btn-generate { width: 100%; padding: 16px; border-radius: var(--radius); border: none; background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
  .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-generate:not(:disabled):active { background: var(--accent-hover); }

  /* History cards */
  .run-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 12px; margin-bottom: 12px; }
  .run-card .card-header { display: flex; gap: 12px; align-items: start; }
  .run-card .card-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border); flex-shrink: 0; }
  .run-card .card-info { flex: 1; min-width: 0; }
  .run-card .card-prompt { font-size: 0.95rem; word-break: break-word; margin-bottom: 4px; }
  .run-card .card-meta { font-size: 0.8rem; color: var(--text2); }

  .status-chip { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .status-chip.queued { background: #333; color: var(--text2); }
  .status-chip.running { background: #1a3a6a; color: var(--accent); }
  .status-chip.done { background: #1a3a1a; color: var(--success); }
  .status-chip.failed { background: #3a1a1a; color: var(--danger); }

  .run-card .card-result { margin-top: 8px; }
  .run-card .card-result img { max-width: 100%; border-radius: var(--radius-sm); cursor: pointer; }
  .run-card .card-actions { margin-top: 8px; display: flex; gap: 8px; }
  .run-card .card-actions button { padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.85rem; cursor: pointer; }
  .run-card .card-actions button:active { background: var(--border); }
  .run-card .card-actions .retry-btn { border-color: var(--accent); color: var(--accent); }

  .empty-state { text-align: center; color: var(--text2); padding: 40px 16px; }

  /* Totop spacing */
  .spacer { flex: 1; }
</style>
</head>
<body>

<!-- Login screen -->
<div id="login-screen">
  <h1>wavegen-web</h1>
  <p>WaveSpeedAI image editor</p>
  <form id="login-form">
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div id="login-error">Invalid password</div>
  </form>
</div>

<!-- Main app -->
<div id="app">
  <div class="app-header"><h1>wavegen-web</h1></div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="new">Workstation</button>
    <button class="tab-btn" data-tab="history">History</button>
  </div>

  <!-- Workstation tab -->
  <div class="tab-content active" id="tab-new">
    <div id="slots"></div>
    <button class="add-slot-btn" id="btn-add-slot">+ Add worker</button>
  </div>

  <!-- History tab -->
  <div class="tab-content" id="tab-history">
    <div class="history-toolbar"><button class="clear-btn" id="btn-clear">Clear finished</button></div>
    <div id="history-list"></div>
    <div class="empty-state" id="history-empty">No runs yet</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── State ──
  let pollTimer = null;
  let lastRuns = {};
  const slots = [];
  let slotSeq = 0;
  let wsInited = false;
  let lastTouchedSlot = null;
  var sharedDir = null;

  // ── DOM refs ──
  const loginScreen = document.getElementById('login-screen');
  const app = document.getElementById('app');
  const loginForm = document.getElementById('login-form');
  const passwordInput = document.getElementById('password-input');
  const loginError = document.getElementById('login-error');
  const slotsContainer = document.getElementById('slots');
  const addSlotBtn = document.getElementById('btn-add-slot');
  const historyList = document.getElementById('history-list');
  const historyEmpty = document.getElementById('history-empty');
  const clearBtn = document.getElementById('btn-clear');

  // ── Tabs ──
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'history') { fetchHistory(); }
    });
  });

  // ── Clear finished runs ──
  clearBtn.addEventListener('click', function() {
    if (!confirm('Delete all finished runs? Active ones are kept.')) return;
    clearBtn.disabled = true;
    fetch('/api/runs/clear', { method: 'POST' })
      .then(function(r) { return r.json(); })
      .then(function() { clearBtn.disabled = false; fetchHistory(); })
      .catch(function() { clearBtn.disabled = false; });
  });

  // ── Workstation slots ──
  function makeSlotEl(n) {
    var el = document.createElement('div');
    el.className = 'slot';
    el.innerHTML =
      '<div class="slot-head">' +
        '<span class="slot-title">Worker ' + n + '</span>' +
        '<span class="slot-lineage"></span>' +
        '<button class="slot-copy">Copy</button>' +
        '<button class="slot-remove" title="Remove">&times;</button>' +
      '</div>' +
      '<div class="slot-upload">' +
        '<div class="slot-thumbs"></div>' +
        '<div class="slot-add">+ add images (paste / drop work too)<input type="file" accept="image/*" multiple style="display:none"></div>' +
      '</div>' +
      '<textarea class="slot-prompt" placeholder="Describe the edit you want..." rows="2"></textarea>' +
      '<div class="slot-statusrow"><span class="slot-chip"></span><span class="slot-elapsed"></span></div>' +
      '<button class="slot-gen" disabled>Generate</button>' +
      '<div class="slot-result" style="display:none">' +
        '<a class="slot-result-link" target="_blank"><img class="slot-result-img" alt="Result" loading="lazy"></a>' +
        '<div class="slot-actions">' +
          '<button class="slot-rerun">Rerun</button>' +
          '<button class="slot-useinput">Use as input</button>' +
          '<button class="slot-download">Download</button>' +
        '</div>' +
      '</div>' +
      '<div class="slot-save">' +
        '<input class="slot-fname" placeholder="filename (auto)" maxlength="80">' +
        '<button class="slot-folder">&#128193; Set folder</button>' +
        '<span class="slot-save-status"></span>' +
      '</div>';
    return el;
  }

  function addSlot(opts) {
    opts = opts || {};
    if (slots.length >= 6) { alert('Max 6 workers — remove one first.'); return null; }
    slotSeq++;
    var el = makeSlotEl(slotSeq);
    var slot = {
      n: slotSeq,
      el: el,
      thumbs: el.querySelector('.slot-thumbs'),
      addZone: el.querySelector('.slot-add'),
      fileInput: el.querySelector('.slot-add input'),
      prompt: el.querySelector('.slot-prompt'),
      chip: el.querySelector('.slot-chip'),
      elapsed: el.querySelector('.slot-elapsed'),
      statusRow: el.querySelector('.slot-statusrow'),
      genBtn: el.querySelector('.slot-gen'),
      resultBox: el.querySelector('.slot-result'),
      resultImg: el.querySelector('.slot-result-img'),
      resultLink: el.querySelector('.slot-result-link'),
      fname: el.querySelector('.slot-fname'),
      folderBtn: el.querySelector('.slot-folder'),
      saveStatus: el.querySelector('.slot-save-status'),
      lineageLabel: el.querySelector('.slot-lineage'),
      fs: (opts.files || []).slice(0, 10),
      runId: null,
      lineage: opts.lineage || null
    };
    if (opts.prompt) { slot.prompt.value = opts.prompt; }
    if (slot.lineage) { slot.lineageLabel.textContent = 'from ' + slot.lineage.slice(0, 8); }

    slot.addZone.addEventListener('click', function() { slot.fileInput.click(); });
    slot.fileInput.addEventListener('change', function() { addSlotFiles(slot, this.files); });
    slot.prompt.addEventListener('input', function() { updateSlotGen(slot); });
    slot.genBtn.addEventListener('click', function() { submitSlot(slot); });
    el.querySelector('.slot-copy').addEventListener('click', function() { copySlot(slot); });
    el.querySelector('.slot-remove').addEventListener('click', function() { removeSlot(slot); });
    el.querySelector('.slot-rerun').addEventListener('click', function() { rerunSlot(slot); });
    el.querySelector('.slot-useinput').addEventListener('click', function() { useResultAsInput(slot); });
    el.querySelector('.slot-download').addEventListener('click', function() { downloadResult(slot); });
    slot.folderBtn.addEventListener('click', function() { pickFolder(slot); });
    updateFolderBtn(slot);
    slot.thumbs.addEventListener('click', function(e) {
      if (e.target && e.target.classList.contains('slot-thumb-x')) {
        var idx = parseInt(e.target.getAttribute('data-i'), 10);
        slot.fs.splice(idx, 1);
        renderSlotThumbs(slot);
        updateSlotGen(slot);
      }
    });
    // hover / focus / click — used to route clipboard pastes
    ['mouseenter', 'focusin', 'click'].forEach(function(ev) {
      el.addEventListener(ev, function() { lastTouchedSlot = slot; });
    });
    // drag & drop — anywhere on the worker card
    el.addEventListener('dragover', function(e) {
      if (e.dataTransfer && e.dataTransfer.types && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1) {
        e.preventDefault();
        el.classList.add('drop-hint');
      }
    });
    el.addEventListener('dragleave', function(e) {
      if (!el.contains(e.relatedTarget)) { el.classList.remove('drop-hint'); }
    });
    el.addEventListener('drop', function(e) {
      e.preventDefault();
      el.classList.remove('drop-hint');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        lastTouchedSlot = slot;
        addSlotFiles(slot, e.dataTransfer.files);
        flashSlot(slot);
      }
    });

    slotsContainer.appendChild(el);
    slots.push(slot);
    renderSlotThumbs(slot);
    updateSlotGen(slot);
    renderSlotStatus(slot);
    renumberSlots();
    return slot;
  }

  function addSlotFiles(slot, files) {
    var remaining = 10 - slot.fs.length;
    for (var i = 0; i < Math.min(files.length, remaining); i++) {
      slot.fs.push(files[i]);
    }
    renderSlotThumbs(slot);
    updateSlotGen(slot);
  }

  function renderSlotThumbs(slot) {
    slot.thumbs.innerHTML = '';
    slot.fs.forEach(function(file, i) {
      var wrap = document.createElement('div');
      wrap.className = 'slot-thumbwrap';
      var img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = '';
      var x = document.createElement('button');
      x.textContent = '\u00d7';
      x.className = 'slot-thumb-x';
      x.setAttribute('data-i', String(i));
      wrap.appendChild(img);
      wrap.appendChild(x);
      slot.thumbs.appendChild(wrap);
    });
  }

  function updateSlotGen(slot) {
    slot.genBtn.disabled = slot.fs.length === 0 || slot.prompt.value.trim() === '';
  }

  function removeSlot(slot) {
    var active = slot.runId && lastRuns[slot.runId] &&
      (lastRuns[slot.runId].status === 'queued' || lastRuns[slot.runId].status === 'running');
    if ((slot.fs.length || slot.prompt.value.trim() || active) && !confirm('Remove Worker ' + slot.n + '?')) { return; }
    if (lastTouchedSlot === slot) { lastTouchedSlot = null; }
    slots.splice(slots.indexOf(slot), 1);
    if (slot.el.parentNode) { slot.el.parentNode.removeChild(slot.el); }
    renumberSlots();
  }

  function copySlot(slot) {
    var s = addSlot({ files: slot.fs.slice(), prompt: slot.prompt.value, lineage: slot.lineage });
    if (!s) { return; }
    // place the copy directly after its source, then renumber everything
    var arrIdx = slots.indexOf(s);
    slots.splice(arrIdx, 1);
    slots.splice(slots.indexOf(slot) + 1, 0, s);
    if (s.el.parentNode) { s.el.parentNode.removeChild(s.el); }
    slot.el.parentNode.insertBefore(s.el, slot.el.nextSibling);
    renumberSlots();
  }

  function renumberSlots() {
    slots.forEach(function(s, i) {
      var t = s.el.querySelector('.slot-title');
      if (t) { t.textContent = 'Worker ' + (i + 1); }
      s.n = i + 1;
    });
    addSlotBtn.disabled = slots.length >= 6;
  }

  function submitSlot(slot) {
    if (slot.genBtn.disabled) { return; }
    var fd = new FormData();
    slot.fs.forEach(function(f) { fd.append('files', f, f.name); });
    fd.append('prompt', slot.prompt.value.trim());
    if (slot.lineage) { fd.append('retry_of', slot.lineage); }
    slot.genBtn.disabled = true;
    slot.genBtn.textContent = 'Submitting…';
    fetch('/api/runs', { method: 'POST', body: fd })
      .then(function(r) { return r.json().then(function(d) { return { status: r.status, data: d }; }); })
      .then(function(resp) {
        slot.genBtn.textContent = 'Generate';
        if (resp.status === 201) {
          slot.runId = resp.data.id;
          slot.resultBox.style.display = 'none';
          renderSlotStatus(slot);
          pollRuns();
        } else {
          alert('Error: ' + (resp.data.error || 'unknown'));
        }
        updateSlotGen(slot);
      })
      .catch(function(err) {
        slot.genBtn.textContent = 'Generate';
        updateSlotGen(slot);
        alert('Network error: ' + err);
      });
  }

  function rerunSlot(slot) {
    var r = slot.runId ? lastRuns[slot.runId] : null;
    if (!r) { return; }
    fetch('/api/runs/' + r.id + '/retry', { method: 'POST' })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data && data.id) {
          slot.runId = data.id;
          slot.resultBox.style.display = 'none';
          renderSlotStatus(slot);
          pollRuns();
        } else {
          alert(data && data.error ? data.error : 'Rerun failed');
        }
      })
      .catch(function() { alert('Rerun failed'); });
  }

  function renderSlotStatus(slot) {
    var r = slot.runId ? lastRuns[slot.runId] : null;
    if (!r) { slot.statusRow.classList.remove('visible'); return; }
    if (r.status === 'queued' || r.status === 'running') {
      slot.statusRow.classList.add('visible');
      slot.chip.className = 'slot-chip status-chip ' + r.status;
      slot.chip.textContent = (r.status === 'running') ? 'Running' : 'Queued';
      var now = Math.floor(Date.now() / 1000);
      var since = (r.status === 'running' && r.started_at) ? r.started_at : r.created_at;
      slot.elapsed.textContent = since ? (Math.max(0, now - Math.floor(since)) + 's') : '';
      slot.resultBox.style.display = 'none';
    } else if (r.status === 'done') {
      slot.statusRow.classList.add('visible');
      slot.chip.className = 'slot-chip status-chip done';
      slot.chip.textContent = 'Done';
      slot.elapsed.textContent = '';
      var url = '/api/runs/' + r.id + '/result';
      if (slot.resultImg.getAttribute('src') !== url) { slot.resultImg.src = url; }
      slot.resultLink.href = url;
      slot.resultBox.style.display = 'block';
    } else if (r.status === 'failed') {
      slot.statusRow.classList.add('visible');
      slot.chip.className = 'slot-chip status-chip failed';
      slot.chip.textContent = 'Failed';
      slot.elapsed.textContent = r.error ? String(r.error).slice(0, 60) : '';
      slot.resultBox.style.display = 'none';
    }
  }

  function useResultAsInput(slot) {
    var r = slot.runId ? lastRuns[slot.runId] : null;
    if (!r || r.status !== 'done') { return; }
    if (slot.fs.length >= 10) { alert('Already at 10 images.'); return; }
    fetch('/api/runs/' + r.id + '/result')
      .then(function(res) { return res.blob().then(function(b) { return new File([b], 'result-' + r.id.slice(0, 8) + '.jpg', { type: b.type || 'image/jpeg' }); }); })
      .then(function(f) {
        slot.fs.push(f);
        renderSlotThumbs(slot);
        updateSlotGen(slot);
      })
      .catch(function() { alert('Could not fetch result image.'); });
  }

  addSlotBtn.addEventListener('click', function() { addSlot(); });

  // ── Clipboard paste → attach to the relevant worker ──
  document.addEventListener('paste', function(e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var imgs = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) { imgs.push(f); }
      }
    }
    if (!imgs.length) { return; }
    var target = null;
    var t = e.target;
    if (t && t.closest) {
      var card = t.closest('.slot');
      if (card) {
        for (var j = 0; j < slots.length; j++) {
          if (slots[j].el === card) { target = slots[j]; break; }
        }
      }
    }
    if (!target) { target = lastTouchedSlot; }
    if (!target && slots.length) { target = slots[0]; }
    if (!target) { return; }
    e.preventDefault();
    addSlotFiles(target, imgs);
    flashSlot(target);
  });

  function flashSlot(slot) {
    slot.el.classList.add('flash');
    setTimeout(function() { slot.el.classList.remove('flash'); }, 700);
  }

  // ── Save folder + filenames (folder handle persists in IndexedDB) ──
  function idbOpen() {
    return new Promise(function(res, rej) {
      var req = indexedDB.open('wavegen', 1);
      req.onupgradeneeded = function() { req.result.createObjectStore('kv'); };
      req.onsuccess = function() { res(req.result); };
      req.onerror = function() { rej(req.error); };
    });
  }
  function idbGet(k) {
    return idbOpen().then(function(db) {
      return new Promise(function(res, rej) {
        var t = db.transaction('kv', 'readonly').objectStore('kv').get(k);
        t.onsuccess = function() { res(t.result); };
        t.onerror = function() { rej(t.error); };
      });
    });
  }
  function idbSet(k, v) {
    return idbOpen().then(function(db) {
      return new Promise(function(res, rej) {
        var t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
        t.onsuccess = function() { res(); };
        t.onerror = function() { rej(t.error); };
      });
    });
  }
  function loadSharedDir() {
    idbGet('saveDir').then(function(h) {
      if (h && h.name) {
        sharedDir = h;
        slots.forEach(function(s2) { updateFolderBtn(s2); });
      }
    }).catch(function() {});
  }
  function saveSharedDir(h) { idbSet('saveDir', h).catch(function() {}); }

  function updateFolderBtn(slot) {
    var d = slot.dir || sharedDir;
    slot.folderBtn.textContent = d ? ('\uD83D\uDCC1 ' + d.name) : '\uD83D\uDCC1 Set folder';
  }

  function saveStatus(slot, msg) {
    slot.saveStatus.textContent = msg;
    clearTimeout(slot._stTimer);
    slot._stTimer = setTimeout(function() { slot.saveStatus.textContent = ''; }, 5000);
  }

  async function pickFolder(slot) {
    if (!window.showDirectoryPicker) {
      alert('Direct-to-folder saving needs an https origin (browser security rule).\n\nFor now, downloads use your filename and land in the browser download folder, which de-dupes with 1, 2, ...\n\nWant https for this app? Ask Nolan.');
      return;
    }
    try {
      var h = await window.showDirectoryPicker({ mode: 'readwrite' });
      slot.dir = h;
      sharedDir = h;
      saveSharedDir(h);
      updateFolderBtn(slot);
      saveStatus(slot, 'folder: ' + h.name);
    } catch (err) {}
  }

  async function downloadResult(slot) {
    var r = slot.runId ? lastRuns[slot.runId] : null;
    if (!r || r.status !== 'done') { return; }
    var resp = await fetch('/api/runs/' + r.id + '/result');
    var blob = await resp.blob();
    var ext = blob.type.indexOf('png') !== -1 ? '.png' : '.jpg';
    var base = (slot.fname.value.trim() || ('wavegen-' + r.id.slice(0, 8))).replace(/\.(jpe?g|png|webp)$/i, '');
    var dir = slot.dir || sharedDir;
    var wrote = false;
    if (window.showDirectoryPicker && dir) {
      try {
        var perm = await dir.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') { perm = await dir.requestPermission({ mode: 'readwrite' }); }
        if (perm === 'granted') {
          var name = base + ext, i = 1;
          for (;;) {
            try { await dir.getFileHandle(name, { create: false }); name = base + '-' + (i++) + ext; }
            catch (err) { break; }
          }
          var fh = await dir.getFileHandle(name, { create: true });
          var w = await fh.createWritable();
          await w.write(blob);
          await w.close();
          wrote = true;
          saveStatus(slot, 'saved ' + name + ' \u2713');
        }
      } catch (err) {}
    }
    if (!wrote) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = base + ext;
      document.body.appendChild(a);
      a.click();
      setTimeout(function() { URL.revokeObjectURL(a.href); if (a.parentNode) { a.parentNode.removeChild(a); } }, 4000);
      saveStatus(slot, 'downloaded \u2713');
    }
  }

  function initWorkstation() {
    if (!wsInited) {
      wsInited = true;
      loadSharedDir();
      addSlot();
      addSlot();
    }
  }


  // ── Login ──
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const pw = passwordInput.value;
    loginError.style.display = 'none';

    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'password=' + encodeURIComponent(pw),
    }).then(function(r) {
      // fetch() follows the redirect automatically, so a successful
      // login arrives here as 200 (r.ok); direct 302/303 also handled.
      if (r.ok || r.status === 303 || r.status === 302) {
        // Login OK — show app
        loginScreen.style.display = 'none';
        app.style.display = 'flex';
        initWorkstation();
        fetchHistory();
        pollRuns();
      } else {
        loginError.style.display = 'block';
      }
    }).catch(function() {
      loginError.style.display = 'block';
    });
  });

  // ── Check if already authed on load ──
  function checkAuth() {
    fetch('/api/runs?limit=1', { method: 'GET' })
      .then(function(r) {
        if (r.ok) {
          loginScreen.style.display = 'none';
          app.style.display = 'flex';
          initWorkstation();
          fetchHistory();
          pollRuns();
        }
      })
      .catch(function() {});
  }
  checkAuth();

  // ── Poll runs ──
  function pollRuns() {
    if (pollTimer) clearTimeout(pollTimer);
    fetchHistory();
    pollTimer = setTimeout(pollRuns, 2500);
  }

  function fetchHistory() {
    fetch('/api/runs?limit=50', { method: 'GET' })
      .then(function(r) { return r.json(); })
      .then(function(runs) {
        lastRuns = {};
        runs.forEach(function(r) { lastRuns[r.id] = r; });
        renderHistory(runs);
        slots.forEach(function(s) { renderSlotStatus(s); });
        // If any run is queued or running, continue polling
        const active = runs.some(function(r) { return r.status === 'queued' || r.status === 'running'; });
        if (!active && pollTimer) {
          clearTimeout(pollTimer);
          pollTimer = null;
        }
      })
      .catch(function() {});
  }

  function renderHistory(runs) {
    if (!runs || runs.length === 0) {
      historyList.innerHTML = '';
      historyEmpty.style.display = 'block';
      return;
    }
    historyEmpty.style.display = 'none';
    var html = '';
    runs.forEach(function(r) {
      var statusClass = r.status;
      var statusLabel = r.status.charAt(0).toUpperCase() + r.status.slice(1);
      var timeStr = r.created_at ? new Date(r.created_at * 1000).toLocaleString() : '';
      var thumbUrl = '';
      if (r.input_filenames && r.input_filenames.length > 0) {
        thumbUrl = '/api/runs/' + r.id + '/input/1';
      }
      var resultUrl = r.status === 'done' && r.result_filename ? ('/api/runs/' + r.id + '/result') : '';
      var retryLink = '/api/runs/' + r.id + '/retry';
      var retryOf = r.retry_of ? 'From ' + r.retry_of.slice(0, 8) : '';

      html += '<div class="run-card" data-id="' + r.id + '">';
      html += '<div class="card-header">';
      if (thumbUrl) {
        html += '<img class="card-thumb" src="' + thumbUrl + '" alt="" loading="lazy">';
      }
      html += '<div class="card-info">';
      html += '<div class="card-prompt">' + esc(r.prompt) + '</div>';
      html += '<div class="card-meta">';
      html += '<span class="status-chip ' + statusClass + '">' + statusLabel + '</span> ';
      html += timeStr + ' ';
      if (retryOf) html += '· ' + retryOf + ' ';
      if (r.error) html += '· ' + esc(r.error.slice(0, 120));
      html += '</div></div></div>';

      if (resultUrl) {
        html += '<div class="card-result"><a href="' + resultUrl + '" download><img src="' + resultUrl + '" alt="Result" loading="lazy"></a></div>';
      }

      var isActive = (r.status === 'queued' || r.status === 'running');
      html += '<div class="card-actions">';
      html += '<button class="retry-btn" data-id="' + r.id + '">Retry</button>';
      if (r.status !== 'queued') {
        html += '<button class="edit-btn" data-id="' + r.id + '">Edit</button>';
      }
      if (resultUrl) {
        html += '<a href="' + resultUrl + '" download><button>Download</button></a>';
      }
      if (!isActive) {
        html += '<button class="delete-btn" data-id="' + r.id + '">Delete</button>';
      }
      html += '</div>';
      html += '</div>';
    });
    historyList.innerHTML = html;

    // Attach retry handlers
    historyList.querySelectorAll('.retry-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = btn.dataset.id;
        btn.disabled = true;
        btn.textContent = 'Retrying…';
        fetch('/api/runs/' + id + '/retry', { method: 'POST' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            btn.textContent = 'Retry';
            btn.disabled = false;
            pollRuns();
          })
          .catch(function() {
            btn.textContent = 'Retry';
            btn.disabled = false;
          });
      });
    });

    // Attach delete handlers
    historyList.querySelectorAll('.delete-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = btn.dataset.id;
        if (!confirm('Delete this run?')) return;
        btn.disabled = true;
        fetch('/api/runs/' + id, { method: 'DELETE' })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data && data.error) { alert(data.error); btn.disabled = false; return; }
            fetchHistory();
          })
          .catch(function() { btn.disabled = false; });
      });
    });

    // Attach edit handlers — reopen a copy in the New tab
    historyList.querySelectorAll('.edit-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = btn.dataset.id;
        var r = lastRuns[id];
        if (!r) return;
        btn.disabled = true;
        var fnames = r.input_filenames || [];
        Promise.all(fnames.map(function(name, i) {
          return fetch('/api/runs/' + id + '/input/' + (i + 1))
            .then(function(res) {
              if (!res.ok) throw new Error('input ' + (i + 1));
              return res.blob().then(function(b) {
                return new File([b], name, { type: b.type || 'image/jpeg' });
              });
            });
        })).then(function(files) {
          var s = addSlot({ files: files, prompt: r.prompt, lineage: id });
          if (s) {
            var tabBtn = document.querySelector('.tab-btn[data-tab="new"]');
            if (tabBtn) tabBtn.click();
            window.scrollTo(0, 0);
          }
          btn.disabled = false;
        }).catch(function() {
          btn.disabled = false;
          alert("Could not reload that run's images.");
        });
      });
    });
  }

  function esc(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

})();
</script>
</body>
</html>
